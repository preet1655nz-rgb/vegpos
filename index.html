<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VegPOS">
<meta name="format-detection" content="telephone=no">
<title>VegPOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2334C759'/%3E%3Cpath d='M20 38c0-9 6-16 16-18-1 10-7 17-16 18Zm0 0c4-4 8-7 12-9' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="boot" class="auth"><div class="spin"></div></div>

<!-- Sign in -->
<div id="auth" class="auth" hidden>
  <div class="auth-box" id="auth-box"></div>
</div>

<!-- App -->
<div id="shell" class="shell" hidden>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <main class="main">
    <section class="view" id="v-orders"></section>
    <section class="view" id="v-new"></section>
    <section class="view" id="v-inventory"></section>
    <section class="view" id="v-insights"></section>
    <section class="view" id="v-settings"></section>
  </main>
  <button class="cartbar" id="cartbar" type="button" aria-label="Review order">
    <span class="cnt" id="cartbar-cnt">0</span><span class="lbl" id="cartbar-lbl">Review order</span><span class="amt" id="cartbar-amt">$0.00</span>
  </button>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div class="sheet-head"><span id="sheet-left"></span><h2 id="sheet-title"></h2><span id="sheet-right"></span></div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot" hidden></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
</body>
</html>
