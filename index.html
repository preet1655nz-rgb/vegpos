<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VegPOS — Premium Order & Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #F8F5F0;
  --card: #FFFFFF;
  --text: #1C1917;
  --text-muted: #78716C;
  --accent: #C2410C;
  --accent-hover: #9A3412;
  --accent-light: #FFF7ED;
  --gold: #D97706;
  --border: #E7E5E4;
  --shadow: 0 8px 30px rgba(28, 25, 23, 0.06);
  --shadow-sm: 0 2px 12px rgba(28, 25, 23, 0.04);
  --radius: 20px;
  --danger: #DC2626;
  --warning: #EA580C;
  --success: #16A34A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}
.app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 20px 110px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 36px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.6px;
  color: var(--text);
}
.logo i { 
  color: var(--accent); 
  font-size: 32px; 
  background: var(--accent-light);
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav {
  display: flex;
  gap: 6px;
  background: var(--card);
  padding: 6px;
  border-radius: 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.nav button {
  background: transparent;
  border: none;
  padding: 12px 22px;
  border-radius: 14px;
  font-weight: 600;
  font-size: 14px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav button.active, .nav button:hover {
  background: var(--accent);
  color: white;
}
.section { display: none; }
.section.active { display: block; animation: fadeIn 0.35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.stat-value { font-size: 34px; font-weight: 700; margin: 8px 0; letter-spacing: -0.5px; }
.stat-label { color: var(--text-muted); font-size: 14px; font-weight: 500; }
.stat-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px; }
.stat-icon.green { background: #ECFDF5; color: #16A34A; }
.stat-icon.orange { background: var(--accent-light); color: var(--accent); }
.stat-icon.blue { background: #EFF6FF; color: #2563EB; }
.product-grid, .order-list, .inventory-list {
  display: grid;
  gap: 16px;
}
.product-item, .order-item, .inv-item {
  background: var(--card);
  border-radius: 18px;
  padding: 22px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: all 0.2s ease;
}
.product-item:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 14px 26px;
  border-radius: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 15px;
}
.btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn.secondary { background: #F5F5F4; color: var(--text); }
.btn.secondary:hover { background: #E7E5E4; }
.btn.danger { background: var(--danger); }
.btn.small { padding: 9px 16px; font-size: 13px; }
.btn.full { width: 100%; }
input, select, textarea {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 15px;
  font-family: inherit;
  background: #FAFAF9;
  transition: all 0.2s;
}
input:focus, select:focus { outline: none; border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.1); }
.modal {
  position: fixed;
  inset: 0;
  background: rgba(28, 25, 23, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(6px);
}
.modal.active { display: flex; }
.modal-content {
  background: var(--card);
  border-radius: 24px;
  padding: 36px;
  width: 90%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
}
@media (max-width: 768px) {
  .app { padding: 16px 12px 110px; }
  header { flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 24px; }
  .logo { font-size: 22px; }
  .logo i { width: 46px; height: 46px; font-size: 28px; }
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid var(--border);
    border-radius: 0;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    justify-content: space-around;
    z-index: 100;
    box-shadow: 0 -6px 24px rgba(28, 25, 23, 0.08);
    gap: 0;
  }
  .nav button {
    padding: 8px 4px;
    font-size: 11px;
    flex: 1;
    flex-direction: column;
    gap: 3px;
    border-radius: 10px;
  }
  .nav button i { font-size: 20px; }
  .cards { grid-template-columns: 1fr; gap: 14px; }
  .chart-container { height: 240px; padding: 16px; }
  .modal-content { padding: 28px 18px; width: 95%; }
  .product-item, .order-item { padding: 18px; }
  h2 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <i class="fas fa-leaf"></i>
      <span>VegPOS</span>
    </div>
    <nav class="nav">
      <button data-tab="orders" class="active"><i class="fas fa-list"></i> Orders</button>
      <button data-tab="order"><i class="fas fa-plus-circle"></i> New Order</button>
      <button data-tab="dashboard"><i class="fas fa-chart-line"></i> Insights</button>
      <button data-tab="inventory"><i class="fas fa-boxes"></i> Inventory</button>
      <button data-tab="menu"><i class="fas fa-utensils"></i> Menu</button>
    </nav>
  </header>
  <!-- ORDERS (Front screen) -->
  <div id="orders" class="section active">
    <div class="flex-between mb-4">
      <h2>Confirmed Orders</h2>
      <div class="flex">
        <select id="order-filter" onchange="renderOrders()">
          <option value="pending">Upcoming</option>
          <option value="all">All</option>
          <option value="completed">Completed</option>
        </select>
      </div>
    </div>
    <div id="orders-list" class="order-list"></div>
  </div>

  <!-- NEW ORDER -->
  <div id="order" class="section">
    <div class="flex-between mb-4">
      <h2>Create Order</h2>
    </div>
    <div id="product-grid" class="product-grid"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="section">
    <div class="cards" id="stats-cards"></div>
    <div class="chart-container">
      <canvas id="salesChart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="itemsChart"></canvas>
    </div>
  </div>

  <!-- INVENTORY -->
  <div id="inventory" class="section">
    <div class="flex-between mb-4">
      <h2>Inventory</h2>
      <button class="btn secondary" onclick="openAdjustStock()"><i class="fas fa-edit"></i> Adjust Stock</button>
    </div>
    <div id="inventory-list" class="inventory-list"></div>
  </div>

  <!-- MENU -->
  <div id="menu" class="section">
    <div class="flex-between mb-4">
      <h2>Menu & Pricing</h2>
      <button class="btn" onclick="openAddProduct()"><i class="fas fa-plus"></i> Add Item</button>
    </div>
    <div id="menu-list"></div>
  </div>
</div>
<!-- modals -->
<div class="modal" id="order-modal">
  <div class="modal-content">
    <h2>New Order</h2>
    <div class="form-group">
      <label>Customer Name</label>
      <input type="text" id="customer-name" placeholder="Enter name">
    </div>
    <div class="form-group">
      <label>Pickup Date & Time</label>
      <input type="datetime-local" id="pickup-time">
    </div>
    <div id="cart-summary"></div>
    <div class="flex mt-4">
      <button class="btn secondary full" onclick="closeModal('order-modal')">Cancel</button>
      <button class="btn full" onclick="placeOrder()">Place Order</button>
    </div>
  </div>
</div>

<div class="modal" id="add-product-modal">
  <div class="modal-content">
    <h2>Add Product</h2>
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="new-name" placeholder="e.g. Veg Momos">
    </div>
    <div class="form-group">
      <label>Variant / Size</label>
      <input type="text" id="new-variant" placeholder="e.g. 8pcs">
    </div>
    <div class="form-group">
      <label>Price ($)</label>
      <input type="number" id="new-price" step="0.01" placeholder="10">
    </div>
    <div class="form-group">
      <label>Pieces per unit</label>
      <input type="number" id="new-pieces" value="1">
    </div>
    <div class="form-group">
      <label>Initial Stock (pieces)</label>
      <input type="number" id="new-stock" value="0">
    </div>
    <div class="flex mt-4">
      <button class="btn secondary full" onclick="closeModal('add-product-modal')">Cancel</button>
      <button class="btn full" onclick="addProduct()">Add</button>
    </div>
  </div>
</div>

<div class="modal" id="edit-product-modal">
  <div class="modal-content">
    <h2>Edit Product</h2>
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="edit-name">
    </div>
    <div id="edit-variants"></div>
    <button class="btn secondary small mt-4" onclick="addVariantRow()">+ Add Variant</button>
    <div class="flex mt-4">
      <button class="btn secondary full" onclick="closeModal('edit-product-modal')">Cancel</button>
      <button class="btn full" onclick="saveEditProduct()">Save</button>
    </div>
  </div>
</div>

<div class="modal" id="adjust-stock-modal">
  <div class="modal-content">
    <h2>Adjust Stock</h2>
    <div class="form-group">
      <label>Select Product</label>
      <select id="stock-product"></select>
    </div>
    <div class="form-group">
      <label>Change (+/- pieces)</label>
      <input type="number" id="stock-delta" value="10">
    </div>
    <div class="flex mt-4">
      <button class="btn secondary full" onclick="closeModal('adjust-stock-modal')">Cancel</button>
      <button class="btn full" onclick="adjustStock()">Update</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'vegpos_data_v2';

let state = {
  products: [],
  orders: [],
  cart: []
};
let editingProductId = null;

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    state = JSON.parse(saved);
    if (!state.products) state.products = [];
    if (!state.orders) state.orders = [];
  } else {
    // Initial products from user — stock starts at 0 (no pre-filled numbers)
    state.products = [
      { id: 1, name: 'Veg Momos Steamed', variants: [
        { label: '8pcs', price: 10, pieces: 8 },
        { label: '12pcs', price: 15, pieces: 12 },
        { label: '16pcs', price: 20, pieces: 16 }
      ], stock: 0 },
      { id: 2, name: 'Veg Momos Fried', variants: [
        { label: '8pcs', price: 12, pieces: 8 },
        { label: '12pcs', price: 18, pieces: 12 },
        { label: '16pcs', price: 23, pieces: 16 }
      ], stock: 0 },
      { id: 3, name: 'Veg Puff Patties', variants: [
        { label: '1pc', price: 5, pieces: 1 },
        { label: '3pcs', price: 10, pieces: 3 }
      ], stock: 0 },
      { id: 4, name: 'Veg Manchurian', variants: [
        { label: '8pcs Dry', price: 10, pieces: 8 },
        { label: '8pcs Gravy', price: 10, pieces: 8 }
      ], stock: 0 },
      { id: 5, name: 'Veg Spring Roll', variants: [
        { label: '2pcs', price: 10, pieces: 2 }
      ], stock: 0 }
    ];
    state.orders = [];
  }
  state.cart = [];
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ products: state.products, orders: state.orders }));
}

function getNextId(arr) {
  return arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1;
}

// Navigation
document.querySelectorAll('.nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    renderAll();
  });
});

function renderAll() {
  renderDashboard();
  renderProducts();
  renderOrders();
  renderInventory();
  renderMenu();
}

function renderDashboard() {
  const completed = state.orders.filter(o => o.status === 'completed');
  const totalRevenue = completed.reduce((sum, o) => sum + o.total, 0);
  const today = new Date().toDateString();
  const todayRevenue = completed.filter(o => new Date(o.timestamp).toDateString() === today).reduce((s, o) => s + o.total, 0);
  const pending = state.orders.filter(o => o.status === 'pending').length;

  document.getElementById('stats-cards').innerHTML = `
    <div class="card">
      <div class="stat-icon green"><i class="fas fa-dollar-sign"></i></div>
      <div class="stat-label">Total Revenue</div>
      <div class="stat-value">$${totalRevenue.toFixed(2)}</div>
    </div>
    <div class="card">
      <div class="stat-icon orange"><i class="fas fa-calendar-day"></i></div>
      <div class="stat-label">Today's Sales</div>
      <div class="stat-value">$${todayRevenue.toFixed(2)}</div>
    </div>
    <div class="card">
      <div class="stat-icon blue"><i class="fas fa-clock"></i></div>
      <div class="stat-label">Pending Orders</div>
      <div class="stat-value">${pending}</div>
    </div>
  `;

  renderSalesChart();
  renderItemsChart();
}

let salesChart, itemsChart;
function renderSalesChart() {
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toDateString();
    const rev = state.orders.filter(o => o.status === 'completed' && new Date(o.timestamp).toDateString() === key).reduce((s, o) => s + o.total, 0);
    last7.push({ date: d.toLocaleDateString('en', {weekday:'short'}), rev });
  }
  const ctx = document.getElementById('salesChart').getContext('2d');
  if (salesChart) salesChart.destroy();
  salesChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: last7.map(d => d.date),
      datasets: [{
        label: 'Revenue ($)',
        data: last7.map(d => d.rev),
        borderColor: '#059669',
        backgroundColor: 'rgba(5,150,105,0.1)',
        tension: 0.3,
        fill: true,
        pointBackgroundColor: '#059669'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {legend: { display: false } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

function renderItemsChart() {
  const itemSales = {};
  state.orders.filter(o => o.status === 'completed').forEach(o => {
    o.items.forEach(item => {
      const name = item.name + ' (' + item.variant + ')';
      itemSales[name] = (itemSales[name] || 0) + item.price * item.qty;
    });
  });
  const sorted = Object.entries(itemSales).sort((a,b) => b[1] - a[1]).slice(0, 6);
  const ctx = document.getElementById('itemsChart').getContext('2d');
  if (itemsChart) itemsChart.destroy();
  itemsChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(s => s[0]),
      datasets: [{
        label: 'Revenue',
        data: sorted.map(s => s[1]),
        backgroundColor: '#059669',
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {legend: { display: false } },
      indexAxis: 'y'
    }
  });
}

function renderProducts() {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = state.products.map(p => `
    <div class="product-item">
      <div class="flex-between">
        <strong>${p.name}</strong>
        <span class="text-muted">${p.stock} pc</span>
      </div>
      <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;">
        ${p.variants.map((v, i) => `<button class="btn small secondary" onclick="addToCart(${p.id}, ${i})">
          ${v.label} — $${v.price}
        </button>`).join('')}
      </div>
    </div>
  `).join('');
}

function addToCart(productId, variantIndex) {
  const product = state.products.find(p => p.id === productId);
  const variant = product.variants[variantIndex];
  // Allow ordering even with 0 stock (inventory tracks usage)
  const existing = state.cart.find(c => c.productId === productId && c.variantIndex === variantIndex);
  if (existing) return existing.qty++;
  else {
    state.cart.push({
      productId,
      variantIndex,
      name: product.name,
      variant: variant.label,
      price: variant.price,
      pieces: variant.pieces,
      qty: 1
    });
  }
  openNewOrder();
}

function openNewOrder() {
  // Set default pickup to now + 30 min
  const now = new Date();
  now.setMinutes(now.getMinutes() + 30);
  const pad = n => n.toString().padStart(2, '0');
  const local = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.getElementById('pickup-time').value = local;
  renderCart();
  document.getElementById('order-modal').classList.add('active');
  document.getElementById('customer-name').value = '';
  document.getElementById('customer-name').focus();
}

function renderCart() {
  const el = document.getElementById('cart-summary');
  if (!state.cart.length) {
    el.innerHTML = '<p class="text-muted">Cart is empty. Select items from the menu.</p>';
    return;
  }
  const total = state.cart.reduce((s, c) => s + c.price * c.qty, 0);
  el.innerHTML = state.cart.map((c, i) => `
    <div class="cart-item">
      <div>
        <strong>${c.name}</strong> (${c.variant})
      </div>
      <div class="flex" style="align-items:center; gap:8px;">
        <button class="btn small secondary" onclick="changeQty(${i}, -1)" style="padding:6px 10px;">−</button>
        <span style="min-width:24px; text-align:center; font-weight:600;">${c.qty}</span>
        <button class="btn small secondary" onclick="changeQty(${i}, 1)" style="padding:6px 10px;">+</button>
        <span>$${(c.price * c.qty).toFixed(2)}</span>
        <button class="btn small secondary" onclick="removeFromCart(${i})"><i class="fas fa-times"></i></button>
      </div>
    </div>
  `).join('') + `<div class="flex-between mt-4"><strong>Total</strong><strong>$${total.toFixed(2)}</strong></div>`;
}

function changeQty(index, delta) {
  const item = state.cart[index];
  if (!item) return;
  item.qty += delta;
  if (item.qty < 1) {
    state.cart.splice(index, 1);
  }
  renderCart();
}

function removeFromCart(index) {
  state.cart.splice(index, 1);
  renderCart();
}

function placeOrder() {
  const name = document.getElementById('customer-name').value.trim();
  const pickup = document.getElementById('pickup-time').value;
  if (!name) { alert('Please enter customer name'); return; }
  if (!pickup) { alert('Please select pickup date & time'); return; }
  if (!state.cart.length) { alert('Cart is empty'); return; }

  // Deduct stock (can go negative — inventory is for tracking)
  state.cart.forEach(item => {
    const p = state.products.find(pr => pr.id === item.productId);
    if (p) p.stock -= item.pieces * item.qty;
  });

  const total = state.cart.reduce((s, c) => s + c.price * c.qty, 0);
  const order = {
    id: getNextId(state.orders),
    customerName: name,
    pickupTime: pickup,
    items: state.cart.map(c => ({...c})),
    total,
    status: 'pending',
    timestamp: Date.now()
  };
  state.orders.unshift(order);
  state.cart = [];
  saveState();
  closeModal('order-modal');
  // Switch to orders view
  document.querySelector('[data-tab="orders"]').click();
  alert(`Order #${order.id} confirmed for ${name}!`);
}

function formatPickup(dt) {
  if (!dt) return '—';
  const d = new Date(dt);
  return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function renderOrders() {
  const filter = document.getElementById('order-filter').value;
  let list = [...state.orders];
  if (filter !== 'all') list = list.filter(o => o.status === filter);
  // Sort upcoming by pickup time
  if (filter === 'pending') {
    list.sort((a, b) => new Date(a.pickupTime || 0) - new Date(b.pickupTime || 0));
  }
  const el = document.getElementById('orders-list');
  if (!list.length) {
    el.innerHTML = '<div class="card text-muted">No orders yet.</div>';
    return;
  }
  el.innerHTML = list.map(o => `
    <div class="order-item">
      <div class="flex-between">
        <div>
          <strong>#${o.id} — ${o.customerName}</strong>
          <div class="pickup-time" style="margin-top:4px;">
            <i class="fas fa-clock"></i> Pickup: ${formatPickup(o.pickupTime)}
          </div>
          <div class="text-muted" style="font-size:13px; margin-top:2px;">
            Ordered: ${new Date(o.timestamp).toLocaleString()} · $${o.total.toFixed(2)}
          </div>
        </div>
        <span class="badge ${o.status}">${o.status === 'pending' ? 'Confirmed' : 'Completed'}</span>
      </div>
      <div style="margin-top:12px; font-size:14px;">
        ${o.items.map(i => `${i.name} (${i.variant}) ×${i.qty}`).join(', ')}
      </div>
      ${o.status === 'pending' ? `
        <div class="mt-4">
          <button class="btn small" onclick="completeOrder(${o.id})">Mark Completed</button>
          <button class="btn small secondary" onclick="cancelOrder(${o.id})">Cancel</button>
        </div>
      ` : ''}
    </div>
  `).join('');
}

function completeOrder(id) {
  const order = state.orders.find(o => o.id === id);
  if (order) order.status = 'completed';
  saveState();
  renderAll();
}

function cancelOrder(id) {
  const order = state.orders.find(o => o.id === id);
  if (!order || order.status !== 'pending') return;
  // Restore stock
  order.items.forEach(item => {
    const p = state.products.find(pr => pr.id === item.productId);
    if (p) p.stock += item.pieces * item.qty;
  });
  state.orders = state.orders.filter(o => o.id !== id);
  saveState();
  renderAll();
}

function renderInventory() {
  const el = document.getElementById('inventory-list');
  el.innerHTML = state.products.map(p => `
    <div class="inventory-item flex-between">
      <div>
        <strong>${p.name}</strong>
        <div class="text-muted" style="font-size:13px;">${p.variants.length} variants</div>
      </div>
      <div style="text-align:right;">
        <div class="${p.stock < 10 ? 'low-stock' : 'high-stock'}" style="font-size:20px; font-weight:700;">${p.stock}</div>
        <div class="text-muted" style="font-size:12px;">pieces in stock</div>
      </div>
    </div>
  `).join('');
}

function openAdjustStock() {
  const sel = document.getElementById('stock-product');
  sel.innerHTML = state.products.map(p => `<option value="${p.id}">${p.name} (current: ${p.stock})</option>`).join('');
  document.getElementById('adjust-stock-modal').classList.add('active');
}

function adjustStock() {
  const id = parseInt(document.getElementById('stock-product').value);
  const delta = parseInt(document.getElementById('stock-delta').value) || 0;
  const p = state.products.find(pr => pr.id === id);
  if (p) {
    p.stock = Math.max(0, p.stock + delta);
    saveState();
    renderAll();
  }
  closeModal('adjust-stock-modal');
}

function renderMenu() {
  const el = document.getElementById('menu-list');
  el.innerHTML = state.products.map(p => `
    <div class="card mb-4">
      <div class="flex-between">
        <strong>${p.name}</strong>
        <div class="flex">
          <button class="btn small secondary" onclick="openEditProduct(${p.id})">Edit</button>
          <button class="btn small danger" onclick="deleteProduct(${p.id})">Delete</button>
        </div>
      </div>
      <div style="margin-top:12px;">
        ${p.variants.map((v, i) => `
          <div class="flex-between" style="padding:8px 0; border-bottom:1px solid var(--border);">
            <span>${v.label}</span>
            <div class="flex">
              <input type="number" value="${v.price}" style="width:80px;" onchange="updatePrice(${p.id}, ${i}, this.value)">
              <span>pcs: ${v.pieces}</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function updatePrice(productId, variantIndex, newPrice) {
  const p = state.products.find(pr => pr.id === productId);
  if (p) p.variants[variantIndex].price = parseFloat(newPrice) || 0;
  saveState();
}

function openAddProduct() {
  document.getElementById('add-product-modal').classList.add('active');
}

function addProduct() {
  const name = document.getElementById('new-name').value.trim();
  const variant = document.getElementById('new-variant').value.trim() || 'Regular';
  const price = parseFloat(document.getElementById('new-price').value) || 0;
  const pieces = parseInt(document.getElementById('new-pieces').value) || 1;
  const stock = parseInt(document.getElementById('new-stock').value) || 0;
  if (!name || price <= 0) { alert('Name and price required'); return; }

  let product = state.products.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (product) {
    product.variants.push({ label: variant, price, pieces });
    product.stock += stock;
  } else {
    product = {
      id: getNextId(state.products),
      name,
      variants: [{ label: variant, price, pieces }],
      stock
    };
    state.products.push(product);
  }
  saveState();
  closeModal('add-product-modal');
  renderAll();
  ['new-name','new-variant','new-price'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('new-stock').value = '0';
}

function openEditProduct(id) {
  editingProductId = id;
  const p = state.products.find(pr => pr.id === id);
  if (!p) return;
  document.getElementById('edit-name').value = p.name;
  renderEditVariants(p.variants);
  document.getElementById('edit-product-modal').classList.add('active');
}

function renderEditVariants(variants) {
  const el = document.getElementById('edit-variants');
  el.innerHTML = variants.map((v, i) => `
    <div class="variant-row" data-index="${i}">
      <input type="text" placeholder="Label" value="${v.label}" class="v-label">
      <input type="number" placeholder="Price" value="${v.price}" step="0.01" class="v-price" style="width:90px;">
      <input type="number" placeholder="Pcs" value="${v.pieces}" class="v-pieces" style="width:70px;">
      <button class="btn small danger" onclick="removeVariantRow(${i})"><i class="fas fa-times"></i></button>
    </div>
  `).join('');
}

function addVariantRow() {
  const el = document.getElementById('edit-variants');
  const div = document.createElement('div');
  div.className = 'variant-row';
  div.innerHTML = `
    <div class="variant-row">
      <input type="text" placeholder="Label" class="v-label">
      <input type="number" placeholder="Price" step="0.01" class="v-price" style="width:90px;">
      <input type="number" placeholder="Pcs" value="1" class="v-pieces" style="width:70px;">
      <button class="btn small danger" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
    </div>
  `;
  el.appendChild(div);
}

function removeVariantRow(index) {
  // Re-render after removal is handled in save; simple remove
  const rows = document.querySelectorAll('#edit-variants .variant-row');
  if (rows[index]) rows[index].remove();
}

function saveEditProduct() {
  const p = state.products.find(pr => pr.id === editingProductId);
  if (!p) return;
  p.name = document.getElementById('edit-name').value.trim() || p.name;
  const rows = document.querySelectorAll('#edit-variants .variant-row');
  const newVariants = [];
  rows.forEach(row => {
    const label = row.querySelector('.v-label').value.trim();
    const price = parseFloat(row.querySelector('.v-price').value) || 0;
    const pieces = parseInt(row.querySelector('.v-pieces').value) || 1;
    if (label && price > 0) {
      newVariants.push({ label, price, pieces });
    }
  });
  if (newVariants.length) p.variants = newVariants;
  saveState();
  closeModal('edit-product-modal');
  renderAll();
}

function deleteProduct(id) {
  if (confirm('Delete this product?')) {
    state.products = state.products.filter(p => p.id !== id);
    saveState();
    renderAll();
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// Init
loadState();
renderAll();

// Close modal on outside click
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) m.classList.remove('active');
  });
});
</script>
</body>
</html>
