<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170D0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chopsticks &amp; Chaat">
<meta name="application-name" content="Chopsticks &amp; Chaat">
<meta name="description" content="Chopsticks &amp; Chaat staff app — Desi. Crispy. Zingy.">
<meta name="format-detection" content="telephone=no">
<title>Chopsticks &amp; Chaat · Staff</title>
<!-- Brand assets: swap the files in /brand to change the logo everywhere -->
<link rel="icon" type="image/svg+xml" href="brand/logo.svg">
<link rel="icon" type="image/png" sizes="512x512" href="brand/icon-512.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="boot" class="auth"><div class="spin"></div></div>

<!-- Sign in -->
<div id="auth" class="auth" hidden>
  <div class="auth-box" id="auth-box"></div>
</div>

<!-- App -->
<div id="shell" class="shell" hidden>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <main class="main">
    <section class="view" id="v-orders"></section>
    <section class="view" id="v-new"></section>
    <section class="view" id="v-inventory"></section>
    <section class="view" id="v-insights"></section>
    <section class="view" id="v-settings"></section>
  </main>
  <button class="cartbar" id="cartbar" type="button" aria-label="Review order">
    <span class="cnt" id="cartbar-cnt">0</span><span class="lbl" id="cartbar-lbl">Review order</span><span class="amt" id="cartbar-amt">$0.00</span>
  </button>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div class="sheet-head"><span id="sheet-left"></span><h2 id="sheet-title"></h2><span id="sheet-right"></span></div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot" hidden></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
</body>
</html>
