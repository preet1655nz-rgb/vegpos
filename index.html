<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5C56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#064E3B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="rasoi">
<meta name="application-name" content="rasoi">
<meta name="description" content="rasoi · DELI + KITCHEN staff app">
<meta property="og:title" content="rasoi · Staff">
<meta property="og:description" content="rasoi · DELI + KITCHEN staff app">
<meta property="og:image" content="https://vegpos.vercel.app/brand/rasoi/rasoi-logo.jpg">
<meta property="og:image:width" content="784">
<meta property="og:image:height" content="1168">
<meta name="format-detection" content="telephone=no">
<title>rasoi · Staff</title>
<!-- Brand: Preet's final logo (brand/rasoi/rasoi-logo.jpg, unmodified) and pixel crops of it -->
<link rel="icon" type="image/png" sizes="32x32" href="brand/rasoi/favicon-32.png">
<link rel="apple-touch-icon" href="brand/rasoi/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<meta name="build" content="staff v12 (PWA + Web Push alerts with app closed; two stages; WhatsApp; supabase-js 2.118.0)">
<script src="vendor/supabase-js-2.118.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="boot" class="auth"><div class="spin"></div></div>

<!-- Sign in -->
<div id="auth" class="auth" hidden>
  <div class="auth-box" id="auth-box"></div>
</div>

<!-- App -->
<div id="shell" class="shell" hidden>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <main class="main">
    <section class="view" id="v-orders"></section>
    <section class="view" id="v-new"></section>
    <section class="view" id="v-inventory"></section>
    <section class="view" id="v-insights"></section>
    <section class="view" id="v-settings"></section>
  </main>
  <button class="cartbar" id="cartbar" type="button" aria-label="Review order">
    <span class="cnt" id="cartbar-cnt">0</span><span class="lbl" id="cartbar-lbl">Review order</span><span class="amt" id="cartbar-amt">$0.00</span>
  </button>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div class="sheet-head"><span id="sheet-left"></span><h2 id="sheet-title"></h2><span id="sheet-right"></span></div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot" hidden></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
</body>
</html>
